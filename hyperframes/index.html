<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Play With Momoo Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#111;display:grid;place-items:center}.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff8e7;color:#321b57;font-family:Fredoka,sans-serif}.clip{position:absolute}.brand{left:72px;right:72px;top:72px;display:flex;justify-content:space-between;align-items:center;font-size:42px;font-weight:700}.pill{background:#ffd84d;border-radius:99px;padding:16px 28px;font-size:34px}.momoo{top:190px;left:410px;width:260px;height:230px}.head{position:absolute;inset:30px 8px 0;border:12px solid #321b57;border-radius:48% 48% 44%;background:#fff;box-shadow:0 18px #d9cae8}.eye{position:absolute;top:95px;width:20px;height:30px;border-radius:50%;background:#321b57}.eye.one{left:72px}.eye.two{left:129px}.smile{position:absolute;left:94px;top:126px;font-size:62px;color:#ff6b9c}.question{left:70px;right:70px;top:475px;text-align:center}.eyebrow{font-size:34px;letter-spacing:4px;color:#ff6b9c;font-weight:700}.q{font-size:80px;line-height:1.07;font-weight:700;margin-top:28px}.choices{left:85px;right:85px;top:760px;display:grid;gap:34px}.choice{height:150px;display:flex;align-items:center;gap:28px;padding:0 38px;border-radius:40px;border:8px solid #fff;color:#321b57;font-size:54px;font-weight:700;box-shadow:0 18px rgba(50,27,87,.18)}.choice:nth-child(1){background:#ff6b9c}.choice:nth-child(2){background:#67b7ff}.choice:nth-child(3){background:#78e6c3}.letter{display:grid;place-items:center;width:76px;height:76px;border-radius:24px;background:#fff}.count{bottom:205px;left:445px;width:190px;height:190px;display:grid;place-items:center;border-radius:50%;background:#ffd84d;border:10px solid #321b57;font-size:100px;font-weight:700}.reveal{bottom:170px;left:70px;right:70px;text-align:center;font-size:48px;line-height:1.12;font-weight:700}.footer{bottom:64px;width:100%;text-align:center;font-size:28px;opacity:.65}.bubble{position:absolute;border-radius:50%;opacity:.22}.b1{width:270px;height:270px;left:-90px;top:190px;background:#ff6b9c}.b2{width:330px;height:330px;left:850px;top:720px;background:#67b7ff}.b3{width:250px;height:250px;left:-70px;top:1450px;background:#78e6c3}
</style></head><body>
<div id="stage" class="stage" data-composition-id="momoo-quiz" data-start="0" data-width="1080" data-height="1920" data-duration="24" data-fps="30">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div id="brand" class="clip brand" data-start="0" data-duration="24" data-track-index="2"><div>PLAY WITH <span style="color:#ff6b9c">MOMOO</span></div><div class="pill">QUIZ TIME!</div></div>
  <div id="momoo" class="clip momoo" data-start="0" data-duration="24" data-track-index="2"><div class="head"></div><div class="eye one"></div><div class="eye two"></div><div class="smile">ᴗ</div></div>
  <div id="question" class="clip question" data-start="1.4" data-duration="22.6" data-track-index="3"><div class="eyebrow">ONLY SHARP EYES GET THIS</div><div class="q">Which animal can taste with its feet?</div></div>
  <div id="choices" class="clip choices" data-start="3.1" data-duration="20.9" data-track-index="3"><div class="choice"><span class="letter">A</span>Butterfly</div><div class="choice"><span class="letter">B</span>Penguin</div><div class="choice"><span class="letter">C</span>Dolphin</div></div>
  <div id="count" class="clip count" data-start="12" data-duration="3.8" data-track-index="4">3</div>
  <div id="reveal" class="clip reveal" data-start="15.8" data-duration="4.2" data-track-index="4">Butterflies taste with sensors on their feet!</div>
  <div id="cta" class="clip reveal" data-start="20" data-duration="4" data-track-index="4">Did you get it? Comment your score!</div>
  <div id="footer" class="clip footer" data-start="0" data-duration="24" data-track-index="5">Follow for a new brain boost every day ✨</div>
  <audio id="voiceover" data-start="0" data-duration="24" data-track-index="6" data-volume="1" src="assets/quiz-01.mp3"></audio>
</div>
<script src="assets/gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});
tl.from('#brand',{y:-70,opacity:0,duration:.6,ease:'back.out(1.7)'},0)
  .from('#momoo',{scale:0,rotation:-12,duration:.7,ease:'back.out(1.8)'},.15)
  .from('#question',{scale:.75,opacity:0,duration:.55,ease:'back.out(1.5)'},1.4)
  .from('#choices .choice',{x:180,opacity:0,stagger:.18,duration:.55,ease:'back.out(1.4)'},3.1)
  .to('#count',{scale:1.18,duration:.16,repeat:5,yoyo:true,ease:'power2.out'},12)
  .to('#count',{opacity:0,scale:1.8,duration:.35},15.45)
  .from('#reveal',{scale:.5,opacity:0,rotation:-4,duration:.6,ease:'back.out(2)'},15.8)
  .to('#choices .choice:first-child',{background:'#ffd84d',borderColor:'#321b57',scale:1.04,duration:.45},15.8)
  .from('#cta',{y:80,opacity:0,duration:.55,ease:'back.out(1.5)'},20);
window.__timelines=window.__timelines||{};window.__timelines['momoo-quiz']=tl;
</script></body></html>
